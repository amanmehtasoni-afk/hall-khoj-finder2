name: Hall Khoj Finder CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Validate Supabase SQL Migrations & Generate Seed
      run: node backend/scripts/migrate_to_supabase.js

    - name: Execute Autonomous Test Suite
      run: node scratch/test_suite.js
      env:
        PORT: 3000
        NODE_ENV: test
        AUTH_SECRET: ci_test_secret_64_characters_random_string_for_testing_only_1234
        PAYMENT_KEY_ID: rzp_test_ci_mock_key
        PAYMENT_KEY_SECRET: rzp_test_ci_mock_secret
